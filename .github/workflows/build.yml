name: Build Windows EXE

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --disable-pip-version-check -r requirements.txt pyinstaller

      - name: Build EXE
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --name OracleBatchQuery `
            --collect-all oracledb `
            --hidden-import pandas.io.excel._openpyxl `
            --hidden-import openpyxl.cell._writer `
            oracle_batch_query.py

      - name: Prepare release asset
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $label = "${{ github.ref_name }}"
          } else {
            $label = "dev"
          }
          $target = "dist/OracleBatchQuery-$label-win64.exe"
          Copy-Item -LiteralPath "dist/OracleBatchQuery.exe" -Destination $target
          "ASSET_PATH=$target" >> $env:GITHUB_ENV

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: OracleBatchQuery-${{ github.ref_name }}-windows
          path: ${{ env.ASSET_PATH }}
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: ${{ env.ASSET_PATH }}
          generate_release_notes: true
